<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
  <title>TibPortal</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body>
  <div class="bar">
    <div class="brand">TibPortal</div>
    <div id="tabs" class="tabs" role="tablist"></div>
    <button id="add" class="add" title="Add profile">+</button>
    <div class="spacer"></div>
    <div class="modes" role="group" aria-label="View">
      <button id="mode-tabs" class="mode" title="One session at a time">Tabs</button>
      <button id="mode-grid" class="mode" title="Show sessions side by side">Grid</button>
    </div>
  </div>
  <script src="ui.js"></script>
</body>
</html>
