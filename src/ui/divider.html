<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'">
  <title>Divider</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    #bar { position: absolute; inset: 0; background: #14161a; }
    #bar:hover, #bar.dragging { background: #5b9dff; }
    body.col #bar { cursor: col-resize; }
    body.row #bar { cursor: row-resize; }
  </style>
</head>
<body>
  <div id="bar" title="Drag to resize. Double-click to even out."></div>
  <script src="divider.js"></script>
</body>
</html>
