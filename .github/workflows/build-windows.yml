name: Build Windows

on:
  push:
    branches: [main, master, 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Build installer and portable .exe
        run: npm run dist

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: TibPortal-windows
          path: |
            dist/TibPortal-Setup-*.exe
            dist/TibPortal-Portable-*.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TibPortal-Setup-*.exe
            dist/TibPortal-Portable-*.exe
          generate_release_notes: true
