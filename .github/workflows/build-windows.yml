name: Build Windows

on:
  push:
    branches: [main, master, 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub Release (tag v<package.json version>) with the .exe files
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Build installer and portable .exe
        run: npm run dist

      - name: Check update files were built
        shell: bash
        run: |
          test -f dist/latest.yml
          test -f dist/win-unpacked/resources/app-update.yml
          cat dist/latest.yml

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: TibPortal-windows
          path: |
            dist/TibPortal-Setup-*.exe
            dist/TibPortal-Setup-*.exe.blockmap
            dist/TibPortal-Portable-*.exe
            dist/latest.yml
          if-no-files-found: error

      - name: Read version
        id: version
        shell: bash
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          # latest.yml and the blockmap let installed copies update themselves.
          files: |
            dist/TibPortal-Setup-*.exe
            dist/TibPortal-Setup-*.exe.blockmap
            dist/TibPortal-Portable-*.exe
            dist/latest.yml
          fail_on_unmatched_files: true
          generate_release_notes: true
